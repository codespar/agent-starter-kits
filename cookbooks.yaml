# The docs cookbooks as the Playground offers them (CONTRATO v1.8). One entry per page of the docs site's
# content/docs/cookbooks/ (meta.json order, `index` left out). The hosted catalog emits them as `recipes`, and the build
# refuses a hosted entry whose kit or example does not exist, a slug listed twice, and a kit whose `presentation.cookbook`
# this file does not host on that kit.
#
#   hosted     a kit and one of its examples run it in the Playground. `coverage: partial` says, in `not_covered`,
#              what the kit does not do of the page.
#   local      it runs on your machine from a CLI template (`template`; the catalog derives the command from `cli`).
#   reference  a page to read, or a flow that needs a platform surface the hosted kits do not reach yet.
#
# A recipe that is not hosted says why (`reason`). `prerequisites.keys` are variable NAMES, never values. Decision D3 of
# 27/11 (Fabiano): hosted when a kit and an example exist, partial overlaps offered with their scope stated, local or
# reference otherwise. To reverse one entry, change its `status` and fields here; the build checks the rest.
v: 1
docs:
  repository: codespar/codespar-web
  commit: d0bdff1be41894fdaa171c706b83d8fc78bc6298
  path: content/docs/cookbooks
cli: "@codespar/cli@0.22.8"
cookbooks:
  - slug: shopping-agent
    title: { pt-BR: "Agente de compras", en: "Shopping Agent" }
    status: reference
    inputs:
      - { name: store_url, pt-BR: "A loja onde comprar", en: "The store to buy from" }
      - { name: item, pt-BR: "O que comprar", en: "What to buy" }
    prerequisites:
      keys: [CODESPAR_API_KEY]
      mandate: { pt-BR: "Um mandato de consumidor assinado, com teto e loja permitida.", en: "A signed consumer mandate, with a cap and the store allowed." }
    expected: { pt-BR: "O agente busca na loja, conduz o checkout e paga o Pix pela carteira, dentro do mandato.", en: "The agent searches the store, drives its checkout and pays the Pix from its wallet, inside the mandate." }
    reason: { pt-BR: "Roda no Shop do dashboard, não em um kit: nenhum kit hospedado compra numa loja.", en: "It runs in the dashboard's Shop, not in a kit: no hosted kit buys from a store." }

