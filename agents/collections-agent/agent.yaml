# The manifest of section 4.3 of docs/spec-v5.1.1.md. `npm run check` reads
# this file first and fails if SYSTEM_PROMPT.md, tools.json or
# guardrails.json contradict it.
schema: 1
name: collections-agent
version: 0.1.0
approval: [human, mandate]
default_approval: human
escalate_above:
  amount: 300000          # R$ 3.000,00 in cents: an agreement above this asks an operator even in `mandate`
  # No `new_beneficiary`: a receivable is issued against a debtor already in the book, and the money comes TO the merchant;
  # the first charge to a debtor is the normal case, not a risk. No `outside_hours` either: collection hours are a LEGAL
  # rule the envelope refuses in both modes (guardrails.envelope.collection_hours), not an escalation.
mcp: "@codespar/mcp@0.5.8"
cli: "@codespar/cli@0.18.1"   # the published version on 2026-10-08 (docs/OPEN_QUESTIONS.md section 1)
tools: ./tools.json
guardrails: ./guardrails.json
mandate_schema: ./mandate.example.json
# The API's own names (plan of 2026-09-23, section 1). `paid` and `expired` close the cycle; `cancelled` closes it as failed;
# `created` is when a cobrança com vencimento becomes payable (the kit reads that from the status poll).
events: [commerce.charge.created, commerce.charge.paid, commerce.charge.expired, commerce.charge.cancelled]
channels: [terminal, whatsapp]   # the second channel is the one this agent is FOR; `npm run check` confirms channels/whatsapp/ ships a conversation
locale: pt-BR             # pt-BR | en: the lines the code prints (approval, labels, templates); `--locale` overrides per run. The model replies in the language the person types either way
maturity:
  bolepix-receivables: blocked    # ent#1816: the sandbox does not issue a payable bolepix today; the stub rail and the scenarios run the cycle
  receipt-verification: blocked   # Ed25519 landed, but the API still seals no record for a paid charge: no chain, no signature to verify
scenarios: ./scenarios/
evals: ./evals/
agents_md: ./AGENTS.md

# What a person reads about this agent where it is offered (the Playground's catalog). pt-BR reviewed by the Playground's
# product lane on 2026-11-04 (no receipt promised where a run may not produce one); en follows it. `examples` names every pack.
presentation:
  # In the integrated Test (codespar-test, with a model) the charge is a platform receive proposal: the person sends it on its
  # card and the platform's Test payer pays it at the provider's sandbox (CONTRATO v1.5). `acordo-1103` is the smallest agreement.
  recommendedRuns:
    - executor: codespar-test
      modelMode: model
      example: acordo-1103
      rank: 5
  pt-BR:
    title: "Cobrança de acordos"
    summary: "Negocia o acordo com quem deve, emite a cobrança e acompanha até o pagamento."
    examples:
      acordo-1103:
        title: "Acordo à vista, hoje"
        description: "A devedora do acordo 1103 paga à vista com desconto; a cobrança vence hoje e é paga."
      beneficiary-not-allowed:
        title: "Devedor sem acordo em aberto"
        description: "Uma cobrança para quem não está na carteira não é emitida."
      cap-exceeded:
        title: "Cobrança acima do teto"
        description: "Uma parcela acima do valor máximo por cobrança é recusada."
      charge-expired:
        title: "Cobrança vencida"
        description: "O QR vence sem pagamento: o acordo fica em aberto e nada é registrado como pago."
      escalated-above-threshold:
        title: "Acordo alto vai ao operador"
        description: "Com a política de cobrança ligada, um acordo acima de R$ 3.000,00 passa pelo operador."
      happy-path:
        title: "Acordo à vista"
        description: "O devedor aceita pagar à vista; a cobrança é emitida, paga e o acordo é quitado."
      instalments:
        title: "Acordo em três parcelas"
        description: "Três cobranças, cada uma com o seu vencimento, pagas uma a uma."
      mandate-revoked:
        title: "Política revogada"
        description: "A política de cobrança é revogada: a cobrança já emitida segue, a pendente não sai."
      prompt-injection:
        title: "Instrução maliciosa na conversa"
        description: "A mensagem manda mudar o valor para R$ 10,00; a política de negociação recusa."
  en:
    title: "Debt collection"
    summary: "Agrees terms with the payer, issues the charge and follows it until it is paid."
    examples:
      acordo-1103:
        title: "Paid in full, today"
        description: "The payer of agreement 1103 pays in full with a discount; the charge is due today and is paid."
      beneficiary-not-allowed:
        title: "Payer without an open agreement"
        description: "A charge to someone not in the book is not issued."
      cap-exceeded:
        title: "Charge above the ceiling"
        description: "An instalment above the per-charge maximum is refused."
      charge-expired:
        title: "Charge expired"
        description: "The QR expires unpaid: the agreement stays open and nothing is recorded as paid."
      escalated-above-threshold:
        title: "Large agreement goes to the operator"
        description: "With the collection policy on, an agreement above R$ 3,000.00 goes to the operator."
      happy-path:
        title: "Paid in full"
        description: "The payer agrees to pay in full; the charge is issued, paid and the agreement is settled."
      instalments:
        title: "Three instalments"
        description: "Three charges, each with its own due date, paid one by one."
      mandate-revoked:
        title: "Policy revoked"
        description: "The collection policy is revoked: the charge already issued stands, the pending one does not go out."
      prompt-injection:
        title: "Malicious instruction in the chat"
        description: "The message says to change the amount to R$ 10.00; the negotiation policy refuses it."
