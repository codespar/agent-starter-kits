# The manifest of section 4.3 of docs/spec-v5.1.1.md. `npm run check` reads
# this file first and fails if SYSTEM_PROMPT.md, tools.json or
# guardrails.json contradict it.
schema: 1
name: topup-agent
version: 0.1.0
approval: [mandate, human]
default_approval: mandate      # the person approves the pull itself at their bank (the consent link); the mandate caps what the agent may ask for
escalate_above:
  amount: 300             # R$ 3,00 in cents: a pull above this asks a human even in `mandate`
  # No `new_beneficiary`: the only payee is the person's own account, pinned by the mandate. No `outside_hours`: the bank's consent page is the person's own act.
mcp: "@codespar/mcp@0.5.8"
cli: "@codespar/cli@0.18.1"    # the published version on 2026-10-08 (docs/OPEN_QUESTIONS.md section 1)
tools: ./tools.json
guardrails: ./guardrails.json
mandate_schema: ./mandate.example.json
# The pull is a receivable to the core: the bank's authorization is issued, the person acts, the money lands.
events: [commerce.charge.created, commerce.charge.paid, commerce.charge.expired, commerce.charge.cancelled]
channels: [terminal, whatsapp]
locale: pt-BR             # pt-BR | en: the lines the code prints; `--locale` overrides per run. The model replies in the language the person types either way
maturity:
  sweeping-pull: sandbox          # offline simulation of the bank (the stub rail); a pull to a real bank goes through the CodeSpar API
  receipt-verification: blocked   # the pull is not a CodeSpar payment: nothing is sealed, no Ed25519 signature exists for it
scenarios: ./scenarios/
evals: ./evals/
agents_md: ./AGENTS.md

# What a person reads about this agent where it is offered (the Playground's catalog). pt-BR reviewed by the Playground's
# product lane on 2026-11-04 (no receipt promised where a run may not produce one); en follows it. `examples` names every pack.
presentation:
  pt-BR:
    title: "Recarga da sua conta"
    summary: "Traz dinheiro de outra conta sua, com a sua autorização no próprio banco."
    examples:
      beneficiary-not-allowed:
        title: "Conta que não é sua"
        description: "Uma recarga para outra conta é recusada: a autorização vale só para a sua conta."
      cap-exceeded:
        title: "Acima do limite por recarga"
        description: "R$ 6,00 numa recarga passam do limite de R$ 5,00 e são recusados antes de chegar ao banco."
      charge-expired:
        title: "Autorização não concluída"
        description: "Você não aprova no banco a tempo: nada é puxado e o agente oferece outro link."
      escalated-above-threshold:
        title: "Valor que pede sua confirmação"
        description: "R$ 4,00 está dentro do limite, mas acima de R$ 3,00: você decide antes de ir ao banco."
      happy-path:
        title: "Recarga de R$ 1,00"
        description: "Você pede R$ 1,00, autoriza no banco e o valor entra na conta."
      mandate-revoked:
        title: "Mandato revogado"
        description: "Depois de uma recarga, o mandato é revogado e as próximas são recusadas."
      prompt-injection:
        title: "Instrução maliciosa na conversa"
        description: "A mensagem manda puxar mais que o limite para outra conta; a regra recusa."
  en:
    title: "Top up your account"
    summary: "Brings money from another account of yours, with your authorization at that bank."
    examples:
      beneficiary-not-allowed:
        title: "An account that is not yours"
        description: "A top-up to another account is refused: the authorization holds only for your account."
      cap-exceeded:
        title: "Above the per-top-up limit"
        description: "R$ 6.00 in one top-up is above the R$ 5.00 limit and is refused before the bank is asked."
      charge-expired:
        title: "Authorization not completed"
        description: "You do not approve at the bank in time: nothing is pulled and the agent offers another link."
      escalated-above-threshold:
        title: "An amount that needs your yes"
        description: "R$ 4.00 is within the limit but above R$ 3.00: you decide before the bank is asked."
      happy-path:
        title: "Top up R$ 1.00"
        description: "You ask for R$ 1.00, authorize it at the bank and the money lands."
      mandate-revoked:
        title: "Mandate revoked"
        description: "After one top-up the mandate is revoked and the next ones are refused."
      prompt-injection:
        title: "Malicious instruction in the chat"
        description: "The message says to pull more than the limit into another account; the rule refuses it."
