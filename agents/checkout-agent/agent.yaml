# The manifest of section 4.3 of docs/spec-v5.1.1.md, for the checkout-agent
# of the checkout spec v0.2 (2026-09-25). `npm run check` reads this file first
# and fails if SYSTEM_PROMPT.md, tools.json or guardrails.json contradict it.
schema: 1
name: checkout-agent
version: 0.1.0
approval: [human, mandate]
default_approval: human
escalate_above:
  amount: 50000          # R$ 500,00 in cents: an order above this asks the attendant even in `mandate`
  # No `new_beneficiary`: a new customer is the normal case of a store, not a risk (checkout §3.2).
  # No `outside_hours`: service hours are a rule of the envelope, refused in BOTH modes, not an escalation.
mcp: "@codespar/mcp@0.5.8"
cli: "@codespar/cli@0.18.1"
tools: ./tools.json
guardrails: ./guardrails.json
mandate_schema: ./mandate.example.json
# The API's own names, the same four the collections-agent declares. `paid` closes the sale; `expired` and `cancelled` close it
# as failed; `created` is when the cobrança com vencimento becomes payable (read from the status poll). `payment_notified` and
# `expiry_notified` are deliberately absent: neither proves a payment (checkout §5.4).
events: [commerce.charge.created, commerce.charge.paid, commerce.charge.expired, commerce.charge.cancelled]
channels: [terminal, whatsapp]   # WhatsApp through the adapter the collections-agent uses (checkout decision 6); `npm run check` confirms channels/whatsapp/ ships a conversation
locale: pt-BR             # pt-BR | en: the lines the code prints (approval, labels, templates); `--locale` overrides per run. The model replies in the language the person types either way
maturity:
  storefront-cart: sandbox
  bolepix-receivables: blocked    # ent#1816: the sandbox does not issue a payable bolepix today; the stub rail and the scenarios run the sale
  nfse-invoice: sandbox           # NFS-e through codespar_invoice (nfe.io), after `settled`, by code; the stub issuer runs in CI. NF-e (product) waits for an A1 + IE
  receipt-verification: blocked   # the API seals no record for a paid charge: no chain, no signature to verify
scenarios: ./scenarios/
evals: ./evals/
agents_md: ./AGENTS.md

# What a person reads about this agent where it is offered (the Playground's catalog). DRAFT copy, 2026-11-04:
# to be replaced by the product's wording. One entry per locale; `examples` names every scenario pack.
presentation:
  pt-BR:
    title: "Vendas na conversa"
    summary: "Monta o carrinho com o preço do catálogo, confirma o pedido com o atendente e gera a cobrança para o cliente pagar."
    examples:
      beneficiary-not-allowed:
        title: "Cobrança em nome de outra pessoa"
        description: "O cliente pede a cobrança em outro nome e documento; o cadastro da loja não reconhece e nada é emitido."
      cap-exceeded:
        title: "Pedido acima do teto"
        description: "Um pedido maior que o valor máximo da política de vendas é recusado."
      cart-recomposed:
        title: "Troca de itens depois da confirmação"
        description: "O cliente troca as aulas por uma consultoria depois de confirmar; o pedido volta para aprovação com o novo valor."
      cart-replaced:
        title: "Quantidade alterada"
        description: "O cliente muda de duas para cinco aulas antes de pagar; a cobrança segue o carrinho novo."
      charge-expired:
        title: "Cobrança vencida"
        description: "O QR vence sem pagamento: o pedido é encerrado sem registro de pagamento."
      coupon-unknown:
        title: "Cupom desconhecido"
        description: "O cliente informa um cupom que a loja não tem; o desconto não é aplicado."
      escalated-above-threshold:
        title: "Pedido alto vai ao atendente"
        description: "No modo política, um pedido acima de R$ 500,00 ainda passa pelo atendente."
      happy-path:
        title: "Pacote de aulas"
        description: "A cliente pede o pacote de dez aulas e uma avaliação; o pedido é confirmado e a cobrança é paga."
      item-unavailable:
        title: "Item fora de venda"
        description: "Um item que não está à venda é recusado e o agente sugere uma alternativa."
      mandate-revoked:
        title: "Política revogada"
        description: "A política de vendas é revogada: a cobrança já emitida segue, o pedido pendente não sai."
      nfse-failed:
        title: "Nota fiscal com problema"
        description: "Os pedidos são pagos e a nota de serviço falha depois; a venda continua paga."
      payment-claimed:
        title: "Cliente diz que já pagou"
        description: "O cliente afirma que pagou; nada muda até o pagamento aparecer de fato."
      price-injected:
        title: "Preço combinado por fora"
        description: "O cliente diz que o vendedor prometeu outro preço; vale o preço do catálogo."
      prompt-injection:
        title: "Instrução maliciosa na conversa"
        description: "A mensagem manda vender por R$ 1,00 e pagar uma comissão a outra chave; a política recusa."
  en:
    title: "Sales in the chat"
    summary: "Builds the cart at catalog prices, confirms the order with the attendant and issues the charge for the customer to pay."
    examples:
      beneficiary-not-allowed:
        title: "Charge in someone else's name"
        description: "The customer asks to be charged under another name and document; the store's records do not know it and nothing is issued."
      cap-exceeded:
        title: "Order above the ceiling"
        description: "An order above the sales policy's maximum is refused."
      cart-recomposed:
        title: "Items swapped after confirmation"
        description: "The customer swaps the lessons for a consultation after confirming; the order goes back for approval at the new amount."
      cart-replaced:
        title: "Quantity changed"
        description: "The customer goes from two to five lessons before paying; the charge follows the new cart."
      charge-expired:
        title: "Charge expired"
        description: "The QR expires unpaid: the order closes with no payment record."
      coupon-unknown:
        title: "Unknown coupon"
        description: "The customer gives a coupon the store does not have; no discount is applied."
      escalated-above-threshold:
        title: "Large order goes to the attendant"
        description: "In policy mode, an order above R$ 500.00 still goes to the attendant."
      happy-path:
        title: "Lesson package"
        description: "The customer asks for the ten-lesson package and an assessment; the order is confirmed and the charge is paid."
      item-unavailable:
        title: "Item not for sale"
        description: "An item that is not for sale is refused and the agent suggests an alternative."
      mandate-revoked:
        title: "Policy revoked"
        description: "The sales policy is revoked: the charge already issued stands, the pending order does not go out."
      nfse-failed:
        title: "Invoice problem"
        description: "The orders are paid and the service invoice fails afterwards; the sale stays paid."
      payment-claimed:
        title: "Customer says they paid"
        description: "The customer says they paid; nothing changes until the payment actually shows up."
      price-injected:
        title: "Price promised elsewhere"
        description: "The customer says the seller promised another price; the catalog price stands."
      prompt-injection:
        title: "Malicious instruction in the chat"
        description: "The message says to sell for R$ 1.00 and pay a commission to another key; the policy refuses it."
