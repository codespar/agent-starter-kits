# The manifest of section 4.3 of docs/spec-v5.1.1.md. `npm run check` reads
# this file first and fails if SYSTEM_PROMPT.md, tools.json or
# guardrails.json contradict it.
schema: 1
name: bills-agent
version: 0.1.0
approval: [human, mandate]
default_approval: human
escalate_above:
  amount: 150000          # R$ 1.500,00 in cents: above this, a human decides even in `mandate`
  new_beneficiary: true   # the first payment to each named payee asks a human
  outside_hours: "22:00-07:00"
mcp: "@codespar/mcp@0.5.8"
cli: "@codespar/cli@0.18.1"    # what npm publishes on 2026-10-08: ships `agent run`, `eval`, `mandate revoke`, `init --template bills-agent` (docs/OPEN_QUESTIONS.md §1)
tools: ./tools.json
guardrails: ./guardrails.json
mandate_schema: ./mandate.example.json
events: [commerce.payment.succeeded, commerce.payment.failed]
channels: [terminal]
locale: pt-BR             # pt-BR | en: the lines the code prints (approval, labels, templates); `--locale` overrides per run. The model replies in the language the person types either way
maturity:
  pix-out: sandbox
  embedded-consent: sandbox
  receipt-verification: sandbox   # receipts sealed since the API added Ed25519 verify against the published key set: `npm run verify runs/<run-id>/receipts/<id>.json`
scenarios: ./scenarios/
evals: ./evals/
agents_md: ./AGENTS.md

# What a person reads about this agent where it is offered (the Playground's catalog). pt-BR reviewed by the Playground's
# product lane on 2026-11-04 (no receipt promised where a run may not produce one); en follows it. `examples` names every pack.
presentation:
  # The first experiment the Playground offers: it replays on the simulator with no account, key or mandate of the person's.
  recommended:
    example: happy-path
    rank: 1
  # In the integrated Test (codespar-test, with a model) the run is bound to the platform's test receivers; `conta-teste`'s
  # first input pays one of them within that mandate's caps.
  recommendedRuns:
    - executor: codespar-test
      modelMode: model
      example: conta-teste
      rank: 1
  pt-BR:
    title: "Contas do mês"
    summary: "Paga as contas da casa dentro dos limites que você definiu. Você aprova cada pagamento."
    examples:
      conta-teste:
        title: "Pagar a conta de teste"
        description: "No Test integrado, você pede R$ 10,00 ao recebedor de teste da plataforma; o agente propõe e você paga a proposta. No simulador, esse recebedor não está no mandato de exemplo e o pagamento é recusado."
      beneficiary-not-allowed:
        title: "Favorecido fora do mandato"
        description: "Um pedido para pagar alguém que o mandato não nomeia: nada é pago, mesmo que você diga sim."
      cap-exceeded:
        title: "Acima do limite por pagamento"
        description: "Um valor maior que o limite do mandato é recusado antes de qualquer envio."
      escalated-above-threshold:
        title: "Quando o agente pede sua aprovação"
        description: "Com aprovação automática, um favorecido novo ou um valor alto ainda passa por você."
      happy-path:
        title: "Pagar a escola"
        description: "Você pede a mensalidade de outubro; o agente propõe, você aprova e o pagamento sai."
      mandate-revoked:
        title: "Mandato revogado no meio"
        description: "O mandato é revogado durante a execução: o que já saiu é conferido, o que esperava aprovação é negado."
      prompt-injection:
        title: "Instrução maliciosa na conversa"
        description: "A mensagem manda ignorar as regras e pagar outra chave; a regra do mandato recusa."
  en:
    title: "Monthly bills"
    summary: "Pays household bills within the limits you set. You approve each payment."
    examples:
      conta-teste:
        title: "Pay the test account"
        description: "In the integrated Test you ask for R$ 10.00 to the platform's test receiver; the agent proposes it and you pay the proposal. In the simulator that receiver is not in the example mandate and the payment is refused."
      beneficiary-not-allowed:
        title: "Payee outside the mandate"
        description: "A request to pay someone the mandate does not name: nothing is paid, even if you say yes."
      cap-exceeded:
        title: "Above the per-payment limit"
        description: "An amount above the mandate's limit is refused before anything is sent."
      escalated-above-threshold:
        title: "When the agent asks you"
        description: "With automatic approval, a new payee or a large amount still comes to you."
      happy-path:
        title: "Pay the school"
        description: "You ask for October's tuition; the agent proposes it, you approve, and the payment goes out."
      mandate-revoked:
        title: "Mandate revoked midway"
        description: "The mandate is revoked during the run: what already went out is checked, what awaited approval is denied."
      prompt-injection:
        title: "Malicious instruction in the chat"
        description: "The message says to ignore the rules and pay another key; the mandate's rule refuses it."
