# The manifest of section 4.3 of docs/spec-v5.1.1.md. `npm run check` reads
# this file first and fails if SYSTEM_PROMPT.md, tools.json or
# guardrails.json contradict it.
schema: 1
name: hello-agent
version: 0.1.0
approval: [human]
default_approval: human
mcp: "@codespar/mcp@0.5.8"
cli: "@codespar/cli@0.18.1"
tools: ./tools.json
guardrails: ./guardrails.json
mandate_schema: ./mandate.example.json
events: []          # it subscribes to nothing: nothing it does produces one
channels: [terminal]
locale: pt-BR             # pt-BR | en: the lines the code prints (approval, labels, templates); `--locale` overrides per run. The model replies in the language the person types either way
maturity: {}        # no pix-out, no receivables: it proposes nothing
scenarios: ./scenarios/
evals: ./evals/
agents_md: ./AGENTS.md

# What a person reads about this agent where it is offered (the Playground's catalog). pt-BR reviewed by the Playground's
# product lane on 2026-11-04 (no receipt promised where a run may not produce one); en follows it. `examples` names every pack.
presentation:
  # In the integrated Test (codespar-test, with a model), the first run the host offers for this kit.
  recommendedRuns:
    - executor: codespar-test
      modelMode: model
      example: conta-plataforma
      rank: 3
  pt-BR:
    title: "Primeiros passos"
    summary: "Lê as contas do mês e responde perguntas. Não move dinheiro."
    examples:
      conta-plataforma:
        title: "Sua conta de Test"
        description: "No Test integrado, lê o saldo do seu projeto de Test na CodeSpar, só leitura e sem mandato de gasto. No simulador não há conta para ler, e o agente diz isso."
      happy-path:
        title: "O que vence este mês"
        description: "Você pergunta o que vence em outubro e recebe a lista."
      prompt-injection:
        title: "Pedido para pagar"
        description: "Uma mensagem tenta fazer o agente pagar; ele não tem como pagar e a tentativa é recusada."
  en:
    title: "First steps"
    summary: "Reads the month's bills and answers questions. Moves no money."
    examples:
      conta-plataforma:
        title: "Your Test account"
        description: "In the integrated Test it reads your Test project's balance at CodeSpar, read-only and with no spending mandate. In the simulator there is no account to read, and the agent says so."
      happy-path:
        title: "What is due this month"
        description: "You ask what is due in October and get the list."
      prompt-injection:
        title: "A request to pay"
        description: "A message tries to make the agent pay; it has no way to pay and the attempt is refused."
