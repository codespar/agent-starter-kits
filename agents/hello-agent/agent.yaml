# The manifest of section 4.3 of docs/spec-v5.1.1.md, schema 1. `npm run check`
# reads this file first and fails if SYSTEM_PROMPT.md, tools.json or
# guardrails.json contradict it. Built by following
# skills/codespar-agent-builder/SKILL.md (the read-only kind).
schema: 1
name: hello-agent
version: 0.1.0
approval: [human]
default_approval: human
# No escalate_above: nothing this agent does can reach a human gate, because
# nothing it does creates an execution (tools.json has no payment or charge tool).
mcp: "@codespar/mcp@0.5.8"
cli: "@codespar/cli@0.13.0"    # copied from agents/bills-agent/agent.yaml, the pins verified against npm
tools: ./tools.json
guardrails: ./guardrails.json
mandate_schema: ./mandate.example.json
events: []                     # consumes no event: it moves no money and issues no charge
channels: [terminal]
maturity: {}                   # no capability touches the API; the mandate is read locally
scenarios: ./scenarios/
evals: ./evals/
agents_md: ./AGENTS.md
