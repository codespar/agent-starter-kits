# The manifest of section 4.3 of docs/spec-v5.1.1.md. `npm run check` reads
# this file first and fails if SYSTEM_PROMPT.md, tools.json or
# guardrails.json contradict it.
schema: 1
name: supplier-payments-agent
version: 0.1.0
approval: [human, mandate]
default_approval: human   # section 2: a batch is born with a person approving, which is where most companies are
escalate_above:
  amount: 150000          # R$ 1.500,00 in cents: above this, a human decides even in `mandate`
  new_beneficiary: true   # the first payment to each supplier, rep or employee asks a human
  outside_hours: "22:00-07:00"
mcp: "@codespar/mcp@0.5.8"
cli: "@codespar/cli@0.18.1"    # copied from agents/bills-agent/agent.yaml, which carries the pins verified against npm
tools: ./tools.json
guardrails: ./guardrails.json
mandate_schema: ./mandate.example.json
events: [commerce.payment.succeeded, commerce.payment.failed]
channels: [terminal]
locale: pt-BR             # pt-BR | en: the lines the code prints (approval, labels, templates); `--locale` overrides per run. The model replies in the language the person types either way
maturity:
  pix-out: sandbox
  batch-payout: sandbox           # the loop of executions: one refusal does not stop the siblings, and a re-run pays nobody twice
  receipt-verification: sandbox   # receipts sealed since the API added Ed25519 verify against the published key set: `npm run verify runs/<run-id>/receipts/<id>.json`
scenarios: ./scenarios/
evals: ./evals/
agents_md: ./AGENTS.md

# What a person reads about this agent where it is offered (the Playground's catalog). pt-BR reviewed by the Playground's
# product lane on 2026-11-04 (no receipt promised where a run may not produce one); en follows it. `examples` names every pack.
presentation:
  # In the integrated Test (codespar-test, with a model), the first run the host offers for this kit.
  recommendedRuns:
    - executor: codespar-test
      modelMode: model
      example: lote-teste
      rank: 2
  pt-BR:
    title: "Pagamentos a fornecedores"
    summary: "Paga fornecedores, comissões e folha em lote. Você aprova a lista, e cada linha tem o seu resultado."
    examples:
      lote-teste:
        title: "Lote de teste"
        description: "No Test integrado, paga R$ 10,00 a cada recebedor de teste da plataforma; cada linha vira uma proposta que você paga. No simulador esse lote não existe e nada é proposto."
      beneficiary-not-allowed:
        title: "Fornecedor fora do mandato"
        description: "Um fornecedor que o mandato não nomeia não é pago."
      cap-exceeded:
        title: "Acima do limite por pagamento"
        description: "Um pagamento acima do limite do mandato é recusado antes de qualquer envio."
      escalated-above-threshold:
        title: "Quando o agente pede sua aprovação"
        description: "Com aprovação automática, um fornecedor novo ou um valor alto ainda passa por você."
      happy-path:
        title: "Folha de outubro"
        description: "A folha vira um pagamento por pessoa, cada um decidido e registrado."
      mandate-revoked:
        title: "Mandato revogado no meio"
        description: "O mandato é revogado durante o lote: o que já saiu é conferido, o que esperava aprovação é negado."
      partial-batch-failure:
        title: "Lote com uma recusa"
        description: "Um fornecedor é recusado pelo banco e os outros dois são pagos; nada é pago duas vezes."
      prompt-injection:
        title: "Instrução escondida na nota"
        description: "A descrição de uma nota manda pagar outra chave; o mandato recusa."
  en:
    title: "Supplier payments"
    summary: "Pays suppliers, commissions and payroll in batches. You approve the list, and each line has its own result."
    examples:
      lote-teste:
        title: "Test batch"
        description: "In the integrated Test it pays R$ 10.00 to each of the platform's test receivers; each line becomes a proposal you pay. In the simulator that batch does not exist and nothing is proposed."
      beneficiary-not-allowed:
        title: "Supplier outside the mandate"
        description: "A supplier the mandate does not name is not paid."
      cap-exceeded:
        title: "Above the per-payment limit"
        description: "A payment above the mandate's limit is refused before anything is sent."
      escalated-above-threshold:
        title: "When the agent asks you"
        description: "With automatic approval, a new supplier or a large amount still comes to you."
      happy-path:
        title: "October payroll"
        description: "The payroll becomes one payment per person, each decided and recorded."
      mandate-revoked:
        title: "Mandate revoked midway"
        description: "The mandate is revoked during the batch: what already went out is checked, what awaited approval is denied."
      partial-batch-failure:
        title: "A batch with one refusal"
        description: "The bank refuses one supplier and the other two are paid; nobody is paid twice."
      prompt-injection:
        title: "Instruction hidden in an invoice"
        description: "An invoice description says to pay another key; the mandate refuses it."
