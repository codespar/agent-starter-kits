name: ci

on:
  pull_request:
  push:
    branches: [main]

# Everything here runs without ANTHROPIC_API_KEY and without CODESPAR_API_KEY:
# the replay provider and the stub rail stand in. A failing adversarial case
# or scenario blocks the merge.
jobs:
  gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: secret scan (whole tree)
        run: node scripts/secret-scan.mjs all
      - name: typecheck (includes the transition type test)
        run: npm run typecheck
      - name: npm run check (plugin manifests + manifest coherence of every agent)
        run: npm run check
      - name: adversarial suite + scenarios (replay provider), every agent
        run: |
          npm run eval --workspace=agents/bills-agent
          npm run eval --workspace=agents/collections-agent
      - name: one command, machine output
        run: |
          cd agents/bills-agent
          npm start --silent -- --input "pague a escola de outubro" --approve --json > /tmp/out.json
          node -e 'const o=JSON.parse(require("fs").readFileSync("/tmp/out.json","utf8")); if(o.executions[0].state!=="settled"||o.receipts.length!==1||!o.actor) process.exit(1)'
      # Pinned instant: the collection-hours guardrail (08:00-20:00 America/Sao_Paulo) and the fixture's due date read the
      # engine clock, and the wall clock made this gate red between 20:00 and 08:00 (#16).
      - name: the receivable cycle closes in one command (stub rail, fixture payer, pinned clock)
        run: |
          cd agents/collections-agent
          npm start --silent -- --input "fechado, pago à vista" --transcript test/fixtures/accept-1042.transcript.jsonl --approve --simulate-payer --json --now 2026-09-23T14:00:00-03:00 > /tmp/coll.json
          node -e 'const o=JSON.parse(require("fs").readFileSync("/tmp/coll.json","utf8")); if(o.executions[0].state!=="settled"||o.executions[0].charges.length!==1||o.receipts.length!==1||!o.actor) process.exit(1)'
      - name: tests (core + agent, including restart and rerun)
        run: npm test
