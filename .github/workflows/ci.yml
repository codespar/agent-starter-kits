name: ci

on:
  pull_request:
  push:
    branches: [main]

# Everything here runs without ANTHROPIC_API_KEY and without CODESPAR_API_KEY:
# the replay provider and the stub rail stand in. A failing adversarial case
# or scenario blocks the merge.
jobs:
  gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: secret scan (whole tree)
        run: node scripts/secret-scan.mjs all
      - name: typecheck (includes the transition type test)
        run: npm run typecheck
      - name: npm run check (plugin manifests + manifest coherence of every agent)
        run: npm run check
      - name: adversarial suite + scenarios (replay provider), every agent
        run: |
          npm run eval --workspace=agents/bills-agent
          npm run eval --workspace=agents/collections-agent
          npm run eval --workspace=agents/hello-agent
          npm run eval --workspace=agents/supplier-payments-agent
      # Section 12: one row per scenario per mode, every agent, discovered from
      # `agents/*/agent.yaml` rather than listed — a fourth agent is in the
      # matrix the day it lands. The gate is the FINAL STATE the scenario
      # declares (states, trails, reasons, triggers, receipts), never the
      # wording of a reply. The clock comes from each scenario's own `now`
      # (#16), so the matrix reads the same at 03:00 as at 15:00.
      - name: scenario matrix (section 12), every scenario of every agent
        run: npm run scenarios
      - name: one command, machine output
        run: |
          cd agents/bills-agent
          npm start --silent -- --input "pague a escola de outubro" --approve --json > /tmp/out.json
          node -e 'const o=JSON.parse(require("fs").readFileSync("/tmp/out.json","utf8")); if(o.executions[0].state!=="settled"||o.receipts.length!==1||!o.actor) process.exit(1)'
      # Pinned instant: the collection-hours guardrail (08:00-20:00 America/Sao_Paulo) and the fixture's due date read the
      # engine clock, and the wall clock made this gate red between 20:00 and 08:00 (#16).
      - name: the receivable cycle closes in one command (stub rail, fixture payer, pinned clock)
        run: |
          cd agents/collections-agent
          npm start --silent -- --input "fechado, pago à vista" --transcript test/fixtures/accept-1042.transcript.jsonl --approve --simulate-payer --json --now 2026-09-23T14:00:00-03:00 > /tmp/coll.json
          node -e 'const o=JSON.parse(require("fs").readFileSync("/tmp/coll.json","utf8")); if(o.executions[0].state!=="settled"||o.executions[0].charges.length!==1||o.receipts.length!==1||!o.actor) process.exit(1)'
      # A batch is a loop of executions, so the one-shot asserts the shape a
      # single execution cannot have: three settled lines, three receipts, and
      # a second run of the same batch that pays nobody again.
      - name: a batch runs once, and running it twice pays nobody twice (stub rail, pinned clock)
        run: |
          cd agents/supplier-payments-agent
          export SUPPLIER_PAYMENTS_STATE_DIR=/tmp/supplier-state SUPPLIER_PAYMENTS_RUNS_DIR=/tmp/supplier-runs
          npm start --silent -- --input "roda a folha de outubro" --transcript scenarios/happy-path.transcript.jsonl --approve --json --now 2026-09-23T14:00:00-03:00 > /tmp/batch1.json
          node -e 'const o=JSON.parse(require("fs").readFileSync("/tmp/batch1.json","utf8")); if(o.executions.length!==3||o.executions.some(e=>e.state!=="settled")||o.settled_minor!==540000||o.receipts.length!==3||!o.actor) process.exit(1)'
          npm start --silent -- --input "roda a folha de outubro" --transcript scenarios/happy-path.transcript.jsonl --approve --json --now 2026-09-23T14:00:00-03:00 > /tmp/batch2.json
          node -e 'const o=JSON.parse(require("fs").readFileSync("/tmp/batch2.json","utf8")); if(o.executions.length!==0||o.settled_minor!==0||o.receipts.length!==0) process.exit(1)'

      - name: tests (core + agent, including restart and rerun)
        run: npm test

  # Plan item 2.4: the five-minute contract holds without local Node. This is
  # the same .devcontainer/devcontainer.json a Codespace builds, built here on
  # the published image; the gates inside it run on the replay provider and the
  # stub rail, so the job needs no key either. The action needs Docker on the
  # runner, which ubuntu-latest has; the equivalent by hand is
  # `npx @devcontainers/cli up --workspace-folder .` then `... exec`.
  devcontainer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: build the devcontainer, then run the gates inside it
        uses: devcontainers/ci@v0.3
        with:
          push: never
          runCmd: |
            set -euo pipefail
            node -e 'const [major, minor] = process.versions.node.split(".").map(Number); if (major !== 22 || minor < 13) { console.error(`node ${process.versions.node}; the container must ship 22.13 or newer of the 22 line`); process.exit(1); }'
            test "$(git config core.hooksPath)" = ".githooks"
            npm ci
            npm run check --workspaces --if-present
            cd agents/bills-agent
            npm start --silent -- --input "pague a escola de outubro" --approve --json > /tmp/out.json
            node -e 'const o=JSON.parse(require("fs").readFileSync("/tmp/out.json","utf8")); if(o.executions[0].state!=="settled"||o.receipts.length!==1||!o.actor) process.exit(1)'
